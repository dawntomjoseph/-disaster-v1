<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Segoe UI", Arial, sans-serif;
        }

        body {
            background-image: url('new.png');
            background-repeat: no-repeat;
            background-position: center;
            background-size: cover;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            position: relative;
        }

        body::before {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.35);
            z-index: 0;
            top: 0;
            left: 0;
        }

        .container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 16px;
            padding: 50px;
            box-shadow: 0 8px 32px rgba(31, 38, 135, 0.37);
            border: 2px solid rgba(255, 255, 255, 0.25);
            max-width: 600px;
            width: 100%;
            text-align: center;
            position: relative;
            z-index: 1;
        }

        .container h1 {
            color: #333;
            margin-bottom: 20px;
            font-size: 32px;
        }

        .container p {
            color: #666;
            margin-bottom: 15px;
            font-size: 16px;
        }

        .logout-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 14px 30px;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-block;
            margin-top: 20px;
        }

        .logout-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.4);
        }

        .user-info {
            background: #f5f5f5;
            padding: 20px;
            border-radius: 8px;
            margin: 20px 0;
            text-align: left;
        }

        .user-info h2 {
            color: #333;
            margin-bottom: 15px;
            font-size: 18px;
        }

        .info-item {
            color: #666;
            margin: 10px 0;
            padding: 8px 0;
            border-bottom: 1px solid #eee;
        }

        .info-item:last-child {
            border-bottom: none;
        }

        .info-label {
            font-weight: 600;
            color: #333;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Welcome!</h1>
        <p id="welcomeMessage">You have successfully logged in.</p>
        
        <div class="user-info" id="userInfo">
            <!-- User info will be populated here -->
        </div>

        <a href="/" class="logout-btn" onclick="logout()">Logout</a>
    </div>

    <script>
        // Get URL parameters
        function getQueryParam(param) {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get(param);
        }

        const userId = getQueryParam('user_id');
        const userType = getQueryParam('user_type');

        if (!userId || !userType) {
            window.location.href = '/';
        }

        // Fetch user details
        async function loadUserInfo() {
            try {
                const endpoint = userType === 'volunteer' 
                    ? `/api/volunteer/${userId}` 
                    : `/api/taluk/${userId}`;
                
                const response = await fetch(endpoint);
                const data = await response.json();

                if (data.success) {
                    const user = data.data;
                    const userInfo = document.getElementById('userInfo');
                    
                    let html = `<h2>${userType.charAt(0).toUpperCase() + userType.slice(1)} Details</h2>`;
                    
                    if (userType === 'volunteer') {
                        html += `
                            <div class="info-item"><span class="info-label">Name:</span> ${user.first_name} ${user.last_name}</div>
                            <div class="info-item"><span class="info-label">Email:</span> ${user.email}</div>
                            <div class="info-item"><span class="info-label">Phone:</span> ${user.phone}</div>
                            <div class="info-item"><span class="info-label">Skills:</span> ${user.skills || 'N/A'}</div>
                            <div class="info-item"><span class="info-label">Availability:</span> ${user.availability || 'N/A'}</div>
                            <div class="info-item"><span class="info-label">Bio:</span> ${user.bio || 'N/A'}</div>
                        `;
                    } else if (userType === 'taluk') {
                        html += `
                            <div class="info-item"><span class="info-label">Taluk Name:</span> ${user.name}</div>
                            <div class="info-item"><span class="info-label">Population:</span> ${user.population}</div>
                            <div class="info-item"><span class="info-label">Elevation:</span> ${user.elevation} meters</div>
                        `;
                    }
                    
                    userInfo.innerHTML = html;
                    document.getElementById('welcomeMessage').textContent = 
                        `Welcome back, ${userType === 'volunteer' ? user.first_name : user.name}!`;
                }
            } catch (error) {
                console.error('Error loading user info:', error);
                document.getElementById('userInfo').innerHTML = '<p>Unable to load user information</p>';
            }
        }

        function logout() {
            window.location.href = '/';
        }

        // Load user info on page load
        loadUserInfo();
    </script>
</body>
</html>
