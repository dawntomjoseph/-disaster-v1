<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin Dashboard</title>
    <link rel="stylesheet" href="admin_dashboard.css">
</head>
<body>

<!-- ================= NAVBAR ================= -->
<div class="top-bar">
    <div class="logo">Disaster Relief Admin</div>
    <button class="logout-btn" onclick="logout()">Logout</button>
</div>

<!-- ================= MAIN ================= -->
<div class="main-content">

    <div class="welcome-card">
        <h1>Admin Dashboard</h1>
        <p class="welcome-sub">System overview & control panel</p>
    </div>

    <!-- ================= QUICK ACTIONS ================= -->
    <div class="dashboard-container">
    <div class="box" onclick="showVolunteers()">Volunteer List</div>
    <div class="box" onclick="showTaluks()">Taluk List</div>
    <div class="box" onclick="showRequests()">View Requests</div>
    </div>
    <!-- ================= FLOOD PREDICTION ================= -->
<div class="data-card" style="margin-top:30px;">

    <h2>Flood Risk Prediction</h2>

    <label>Select Taluk:</label><br>
    <select id="talukSelect"></select><br><br>

    <button onclick="predictFlood()">Predict Flood Risk</button>

    <h3 style="margin-top:20px;">
        Predicted Risk:
        <span id="predictionResult">--</span>
    </h3>
    <div style="margin-top:15px;">
    <strong>🧠 AI Suggestions:</strong>
    <ul id="adminSuggestions"></ul>
</div>

</div>

    <!-- ================= DATA SECTION ================= -->
    <div id="data-section" class="data-card hidden">
        <h2 id="section-title">Volunteer List</h2>

        <table id="data-table">
            <thead>
                <tr id="table-head"></tr>
            </thead>
            <tbody id="table-body"></tbody>
        </table>
    </div>

</div>

<script>

/* ---------- AUTH GUARD ---------- */
if (localStorage.getItem("adminLoggedIn") !== "true") {
    window.location.href = "../homepage/index.html";
}

function logout() {
    localStorage.removeItem("adminLoggedIn");
    window.location.href = "../homepage/index.html";
}

/* ---------- UI HELPERS ---------- */
function showSection(title) {
    document.getElementById("section-title").innerText = title;
    document.getElementById("data-section").classList.remove("hidden");
}

/* ---------- VOLUNTEERS ---------- */
function showVolunteers() {
    showSection("Volunteer List");

    fetch("/api/db")
        .then(res => res.json())
        .then(data => {
            const head = document.getElementById("table-head");
            const body = document.getElementById("table-body");

            head.innerHTML = "<th>Name</th><th>Phone</th>";
            body.innerHTML = "";

            data.volunteers.forEach(v => {
                body.innerHTML += `
                    <tr>
                        <td>${v.name}</td>
                        <td>${v.phone || "-"}</td>
                    </tr>`;
            });
        });
}

/* ---------- TALUKS ---------- */
function showTaluks() {
    showSection("Taluk List");

    fetch("/api/taluk")
        .then(res => res.json())
        .then(data => {
            const head = document.getElementById("table-head");
            const body = document.getElementById("table-body");

            head.innerHTML = "<th>Taluk Name</th><th>View Resources</th>";
            body.innerHTML = "";

            data.taluks.forEach(t => {
                body.innerHTML += `
                    <tr>
                        <td>${t.name}</td>
                        <td class="eye-cell"
                            onclick="viewResources('${t.name}')">👁</td>
                    </tr>`;
            });
        });
}

/* ---------- RESOURCES ---------- */
function viewResources(talukName) {
    fetch(`/api/resources?talukName=${talukName}`)
        .then(res => res.json())
        .then(data => {
            alert(
                `Resources for ${talukName}\n\n` +
                `Boats: ${data.resources?.boats || 0}\n` +
                `Rescue Vehicles: ${data.resources?.rescue_vehicles || 0}\n` +
                `Relief Camps: ${data.resources?.relief_camps || 0}`
            );
        });
}

/* ---------- LOAD TALUK DROPDOWN ---------- */
function loadTalukDropdown() {

    fetch("/api/taluk")
        .then(res => res.json())
        .then(data => {

            const select = document.getElementById("talukSelect");
            select.innerHTML = "";

            data.taluks.forEach(t => {
                select.innerHTML +=
                    `<option value="${t.name}">
                        ${t.name}
                     </option>`;
            });
        });
}

function showRequests(){

    showSection("Resource Requests");

    fetch("/api/requests")
    .then(res=>res.json())
    .then(data=>{

        const head = document.getElementById("table-head");
        const body = document.getElementById("table-body");

        head.innerHTML =
        "<th>Taluk</th><th>Resource</th><th>Quantity</th><th>Status</th><th>Reason</th><th>Action</th>";

        body.innerHTML="";

        data.requests.forEach(r=>{

            const resourceDisplay = {
                "boats": "🚤 Rescue Boats",
                "rescue_vehicles": "🚑 Rescue Vehicles", 
                "relief_camps": "🏕 Relief Camps"
            }[r.resource_type] || r.resource_type;

            const isPending = !r.status || r.status.toUpperCase() === 'PENDING';

            body.innerHTML+=`
            <tr>
                <td>${r.taluk}</td>
                <td>${resourceDisplay}</td>
                <td>${r.quantity}</td>
                <td>${r.status || 'PENDING'}</td>
                <td>${r.reason || "-"}</td>
                <td>
                    <button onclick="approveRequest(${r.id})" ${isPending ? '' : 'disabled'}>✔</button>
                    <button onclick="rejectRequest(${r.id})" ${isPending ? '' : 'disabled'}>✖</button>
                </td>
            </tr>
            `;
        })

    });

}
function approveRequest(id){

fetch("/api/approve_request",{

method:"POST",

headers:{"Content-Type":"application/json"},

body:JSON.stringify({id:id})

})
.then(res => res.json())
.then(data => {
    if (data.status === "rejected") {
        alert("Request rejected: " + (data.reason || "Unknown reason"));
    } else {
        alert("Request approved successfully");
    }
    showRequests();
});

}

function rejectRequest(id){

const reason = prompt("Enter rejection reason (optional):", "Manually rejected by admin");

fetch("/api/requests/reject",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({request_id:id, reason: reason || "Manually rejected by admin"})
})
.then(()=>showRequests());

}


/* ---------- FLOOD PREDICTION ---------- */
function predictFlood() {

    fetch("/api/predict_flood", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({
            taluk: document.getElementById("talukSelect").value
        })
    })
    .then(res => res.json())
    .then(data => {

        /* ---------- SHOW RISK ---------- */
        document.getElementById("predictionResult").innerText =
            `${data.risk_level}
             (Rain24h: ${data.rain_today} mm,
             Elevation: ${data.elevation} m)`;

        /* ---------- SHOW AI SUGGESTIONS ---------- */
        const list = document.getElementById("adminSuggestions");
        list.innerHTML = "";

        if (data.ai_suggestions && data.ai_suggestions.length > 0) {
            data.ai_suggestions.forEach(suggestion => {
                const li = document.createElement("li");
                li.textContent = suggestion;
                list.appendChild(li);
            });
        } else {
            const li = document.createElement("li");
            li.textContent = "No recommendations available";
            list.appendChild(li);
        }
    });
}

/* ---------- AUTO LOAD ---------- */
loadTalukDropdown();

/* ---------- LEGACY INLINED FROM admin_dashboard.js ---------- */
const content = document.getElementById("content");

/* LOGOUT (legacy helper, not used by current page, but kept as inline JS) */
function legacyLogout() {
    window.location.href = "../homepage/index.html";
}

/* VOLUNTEERS (legacy helper) */
function legacyLoadVolunteers() {
    fetch("/api/db")
        .then(res => res.json())
        .then(data => {
            const volunteers = data.volunteers || [];

            let html = `
                <h2>Volunteer List</h2>
                <table>
                    <tr>
                        <th>Name</th>
                        <th>Phone</th>
                    </tr>
            `;

            volunteers.forEach(v => {
                html += `
                    <tr>
                        <td>${v.name}</td>
                        <td>${v.phone || "-"}</td>
                    </tr>
                `;
            });

            html += "</table>";
            if (content) {
                content.innerHTML = html;
                content.style.display = "block";
            }
        });
}

/* TALUKS (legacy helper) */
function legacyLoadTaluks() {
    fetch("/api/taluk")
        .then(res => res.json())
        .then(data => {
            const taluks = data.taluks || [];

            let html = `
                <h2>Taluk List</h2>
                <table>
                    <tr>
                        <th>Taluk Name</th>
                        <th>Resources</th>
                    </tr>
            `;

            taluks.forEach(t => {
                html += `
                    <tr>
                        <td>${t.name}</td>
                        <td>
                            <span class="eye" onclick="viewResources('${t.name}')">👁</span>
                        </td>
                    </tr>
                `;
            });

            html += "</table>";
            if (content) {
                content.innerHTML = html;
                content.style.display = "block";
            }
        });
}

/* RESOURCES (legacy helper) */
function legacyViewResources(talukName) {
    fetch(`/api/resources?talukName=${talukName}`)
        .then(res => res.json())
        .then(data => {
            const r = data.resources || {};

            const resourceBody = document.getElementById("resourceBody");
            if (resourceBody) {
                resourceBody.innerHTML = `
                    <p><b>Boats:</b> ${r.boats || 0}</p>
                    <p><b>Rescue Vehicles:</b> ${r.rescue_vehicles || 0}</p>
                    <p><b>Relief Camps:</b> ${r.relief_camps || 0}</p>
                `;
            }

            const resourceModal = document.getElementById("resourceModal");
            if (resourceModal) {
                resourceModal.style.display = "flex";
            }
        });
}

function legacyCloseModal() {
    const resourceModal = document.getElementById("resourceModal");
    if (resourceModal) {
        resourceModal.style.display = "none";
    }
}

</script>
</body>
</html>
