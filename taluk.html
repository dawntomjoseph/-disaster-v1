<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Taluk Management</title>
    <link rel="stylesheet" href="taluk.css">
</head>
<body class="taluk-page">
    <!-- Success Alert -->
    <div id="successAlert" class="success-alert">
        <div class="success-alert-content">
            <svg class="success-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <polyline points="20 6 9 17 4 12"></polyline>
            </svg>
            <h3>Successful Registration!</h3>
            <p>Your taluk entry has been submitted successfully.</p>
        </div>
    </div>

    <!-- Registration Modal -->
    <div id="registrationModal" class="modal">
        <div class="modal-content">
            <button class="close-btn" onclick="closeRegistrationModal()">&times;</button>
            <div class="registration-section modal-registration">
                <div class="badge">NEW TALUK</div>
                <h1>Taluk Registration</h1>
                <p class="subtitle">Add a new taluk to the disaster relief system</p>

                <form id="registrationForm">
                    <div class="form-row">
                        <div class="form-group">
                            <label for="regUsername">Username</label>
                            <input type="text" id="regUsername" name="regUsername" required>
                        </div>
                        <div class="form-group">
                            <label for="regPassword">Password</label>
                            <input type="password" id="regPassword" name="regPassword" required>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="talukName">Taluk Name</label>
                        <input type="text" id="talukName" name="talukName" required>
                    </div>

                    <div class="form-group">
                        <label for="population">Population</label>
                        <input type="number" id="population" name="population" required>
                    </div>

                    <div class="form-group">
                        <label for="elevation">Elevation (meters)</label>
                        <input type="number" id="elevation" name="elevation" step="0.1" required>
                    </div>

                    <button type="submit" class="submit-btn">Register Now</button>
                </form>
            </div>
        </div>
    </div>

    <div class="container">
        <!-- Existing User Section -->
        <div class="login-section">
            <h1>Login</h1>

            <form id="loginForm">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" required>
                </div>

                <div class="form-group password-group">
                    <label for="password">Password</label>
                    <div class="password-wrapper">
                        <input type="password" id="password" name="password" required>
                        <button type="button" class="password-toggle" onclick="togglePassword()">
                            <svg class="eye-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                <circle cx="12" cy="12" r="3"></circle>
                            </svg>
                        </button>
                    </div>
                </div>

                <button type="submit" class="submit-btn login-btn">✓ Login</button>
            </form>

            <div class="new-registration-link">
                <p>Need to add a new taluk? <a href="#" onclick="openRegistrationModal(event)">Register here</a></p>
            </div>
        </div>
    </div>

    <script>
        // Show Success Alert
        function showSuccessAlert() {
            const alert = document.getElementById('successAlert');
            alert.classList.add('show');
            // Auto-hide after 3 seconds
            setTimeout(() => {
                alert.classList.remove('show');
            }, 3000);
        }

        // Login Form Submission
        document.getElementById('loginForm').addEventListener('submit', function(event) {
            event.preventDefault();
            
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value.trim();
            
            console.log('Login attempt - Username:', username, 'Password:', password);
            
            const formData = {
                username: username,
                password: password,
                user_type: 'taluk'
            };
            
            fetch('/api/login', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(formData)
            })
            .then(response => {
                console.log('Response status:', response.status);
                return response.json();
            })
            .then(data => {
                console.log('Response data:', data);
                if (data.success) {
                    window.location.href = '/dashboard.html?user_id=' + data.id + '&user_type=taluk';
                } else {
                    alert('Invalid credentials: ' + data.message);
                }
            })
            .catch(error => {
                console.error('Error:', error);
                alert('Error logging in: ' + error);
            });
        });

        // Registration Form Submission
        document.getElementById('registrationForm').addEventListener('submit', function(event) {
            event.preventDefault();
            
            const formData = {
                username: document.getElementById('regUsername').value,
                password: document.getElementById('regPassword').value,
                talukName: document.getElementById('talukName').value,
                population: document.getElementById('population').value,
                elevation: document.getElementById('elevation').value
            };
            
            fetch('/api/register-taluk', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(formData)
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    showSuccessAlert();
                    this.reset();
                    closeRegistrationModal();
                } else {
                    alert('Error: ' + data.message);
                }
            })
            .catch(error => {
                console.error('Error:', error);
                alert('Error submitting form');
            });
        });

        function togglePassword() {
            const passwordInput = document.getElementById('password');
            const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
            passwordInput.setAttribute('type', type);
        }

        function openRegistrationModal(event) {
            event.preventDefault();
            document.getElementById('registrationModal').style.display = 'flex';
        }

        function closeRegistrationModal() {
            document.getElementById('registrationModal').style.display = 'none';
        }

        // Close modal when clicking outside of it
        window.onclick = function(event) {
            const modal = document.getElementById('registrationModal');
            if (event.target === modal) {
                modal.style.display = 'none';
            }
        }
    </script>
</body>
</html>
