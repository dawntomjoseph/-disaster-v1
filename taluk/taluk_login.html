<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Taluk Login</title>
    <link rel="stylesheet" href="taluk_login.css">
</head>
<body>

<div class="container">

    <div class="login-section">

        <div class="badge">EXISTING USER</div>

        <h1>Taluk Login</h1>

        <p class="subtitle">Welcome back</p>

        <form id="loginForm">

            <div class="form-group">

                <label>Username/taluk name</label>

                <input type="text" id="username" required>

            </div>

            <div class="form-group">

                <label>Password</label>

                <input type="password" id="password" required>

            </div>

            <button type="submit" class="submit-btn login-btn">

                ✓ Login

            </button>

        </form>

        <div class="new-registration-link">

            <p>
                Not registered yet?
                <a href="taluk_register.html">Click here to register</a>
            </p>

        </div>

    </div>

</div>

<script>

/* SIMPLE LOGIN — accepts any username */

document.getElementById("loginForm").addEventListener("submit", function(e){

    e.preventDefault();

    const username = document.getElementById("username").value;

    // save logged in taluk name
    localStorage.setItem("loggedInTaluk", username);

    // go to dashboard
    window.location.href = "taluk_home.html";

});

</script>

</body>
</html>
