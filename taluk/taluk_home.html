<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Taluk Dashboard</title>
    <link rel="stylesheet" href="taluk_home.css">
</head>
<body>

<!-- Top Navigation Bar -->
<header class="top-bar">

    <div class="logo">
        Taluk Disaster Management Portal
    </div>

    <button class="logout-btn" onclick="logout()">
        Logout
    </button>

</header>


<!-- Main Content -->
<div class="main-content">

    <!-- Welcome Section -->
    <div class="welcome-card">

        <h1 id="welcomeText">
            Welcome
        </h1>

        <p class="welcome-sub">
            Manage disaster response and coordinate resources efficiently.
        </p>

    </div>


    <!-- Dashboard Boxes -->
    <div class="dashboard-container">

        <div class="box" onclick="openManageResources()">
    MANAGE<br>RESOURCES
</div>


        <div class="box">
            REQUEST<br>RESOURCES
        </div>

        <div class="box">
            VOLUNTEER<br>MONITORING
        </div>

    </div>

</div>



<script>

/* Run after page loads */
document.addEventListener("DOMContentLoaded", function(){

    const taluk = localStorage.getItem("loggedInTaluk");

    /* If not logged in → redirect */
    if(!taluk){

        window.location.href = "taluk_login.html";
        return;

    }

    /* Show Taluk Name */
    document.getElementById("welcomeText").innerText =
        "Welcome, " + taluk + "👋";

});



/* Logout */
function logout(){

    localStorage.removeItem("loggedInTaluk");

     window.location.href = "../homepage/index.html";

}

</script>

<script>

function openManageResources(){

    window.location.href = "manage_resources.html";

}

</script>

</body>
</html>
