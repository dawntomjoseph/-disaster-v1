<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Taluk Registration</title>
    <link rel="stylesheet" href="taluk_register.css">
</head>
<body>

<div class="container">
    <div class="register-section">

        <div class="badge">NEW TALUK</div>

        <h1>Taluk Registration</h1>
        <p class="subtitle">Create your Taluk account</p>

        <form id="registerForm">

            <div class="form-group">
                <label for="talukName">Taluk Name</label>
                <input type="text" id="talukName" required>
            </div>

            <div class="form-group">
                <label for="population">Population</label>
                <input type="number" id="population" min="0" required>
            </div>

            <div class="form-group">
                <label for="elevation">Elevation (in meters)</label>
                <input type="number" id="elevation" min="0" step="0.01" required>
            </div>

            <!-- NEW LATITUDE FIELD -->
            <div class="form-group">
                <label for="latitude">Latitude</label>
                <input type="number" id="latitude" step="0.000001" min="-90" max="90" required>
            </div>

            <!-- NEW LONGITUDE FIELD -->
            <div class="form-group">
                <label for="longitude">Longitude</label>
                <input type="number" id="longitude" step="0.000001" min="-180" max="180" required>
            </div>

            <div class="form-group">
                <label for="district">District</label>
                <input type="text" id="district" required>
            </div>

            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" required>
            </div>

            <div class="form-group">
                <label for="phone">Phone Number</label>
                <input type="tel" id="phone" required>
            </div>

            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" required>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" required>
            </div>

            <button type="submit" class="submit-btn register-btn">
                ✓ Register
            </button>

        </form>

        <div class="login-link">
            Already registered?  
            <a href="taluk_login.html">Login here</a>
        </div>

    </div>
</div>

<!-- SUCCESS POPUP -->
<div id="successPopup" class="popup">
    <div class="popup-content">
        <div class="checkmark">✓</div>
        <h2>Registration Successful</h2>
        <p>Your Taluk account has been created.</p>
        <button onclick="goToHome()">Go to Home</button>
    </div>
</div>

<script>

document.getElementById("registerForm").addEventListener("submit", function(e) {

    e.preventDefault();

    const talukName = document.getElementById("talukName").value.trim();
    const population = parseInt(document.getElementById("population").value) || 0;
    const elevation = parseFloat(document.getElementById("elevation").value) || 0;
    const latitude = parseFloat(document.getElementById("latitude").value) || 0;
    const longitude = parseFloat(document.getElementById("longitude").value) || 0;
    const district = document.getElementById("district").value.trim();
    const email = document.getElementById("email").value;
    const phone = document.getElementById("phone").value;
    const username = document.getElementById("username").value.trim();
    const password = document.getElementById("password").value;

    fetch('/api/taluk/register', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
            name: talukName,
            username: username,
            password: password,
            district: district,
            population: population,
            elevation: elevation,
            latitude: latitude,
            longitude: longitude
        })
    })
    .then(async (res) => {
        const contentType = res.headers.get('content-type') || '';
        let data;

        if (contentType.includes('application/json')) {
            data = await res.json();
        } else {
            const text = await res.text();
            throw new Error(`Server returned non-JSON response (status ${res.status}). ${text.slice(0, 120)}`);
        }

        if (!res.ok || data.error) {
            throw new Error(data.error || `Request failed with status ${res.status}`);
        }

        localStorage.setItem("loggedInTaluk", data.taluk.name);
        document.getElementById("successPopup").style.display = "flex";
    })
    .catch(err => {
        alert("Registration failed: " + err.message);
    });

});

function goToHome() {
    window.location.href = "../homepage/index.html";
}

</script>

</body>
</html>
