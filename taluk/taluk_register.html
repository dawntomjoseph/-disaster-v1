<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Taluk Registration</title>
    <link rel="stylesheet" href="taluk_register.css">
</head>
<body>

<div class="container">

    <div class="register-section">

        <div class="badge">NEW TALUK</div>

        <h1>Taluk Registration</h1>
        <p class="subtitle">Create your Taluk account</p>

        <form id="registerForm">

            <div class="form-group">
                <label>Taluk Name</label>
                <input type="text" id="talukName" required>
            </div>

            <div class="form-group">
                <label>Population</label>
                <input type="number" id="population" required>
            </div>

            <div class="form-group">
                <label>District</label>
                <input type="text" id="district" required>
            </div>

            <div class="form-group">
                <label>Email</label>
                <input type="email" id="email" required>
            </div>

            <div class="form-group">
                <label>Phone Number</label>
                <input type="tel" id="phone" required>
            </div>

            <div class="form-group">
                <label>Username</label>
                <input type="text" id="username" required>
            </div>

            <div class="form-group">
                <label>Password</label>
                <input type="password" id="password" required>
            </div>

            <button type="submit" class="submit-btn register-btn">
                ✓ Register
            </button>

        </form>

        <div class="login-link">
            Already registered?  
            <a href="taluk_login.html">Login here</a>
        </div>

    </div>

</div>

<!-- SUCCESS POPUP -->
<div id="successPopup" class="popup">
    <div class="popup-content">

        <div class="checkmark">✓</div>

        <h2>Registration Successful</h2>

        <p>Your Taluk account has been created.</p>

        <button onclick="goToHome()">Go to Home</button>

    </div>
</div>

<script>

/* Handle Registration */
document.getElementById("registerForm").addEventListener("submit", function(e) {

    e.preventDefault();

    const talukName = document.getElementById("talukName").value.trim();
    const username = document.getElementById("username").value.trim();
    const password = document.getElementById("password").value;
    const population = parseInt(document.getElementById("population").value, 10) || 0;
    const district = document.getElementById("district").value.trim();
    const email = document.getElementById("email").value;
    const phone = document.getElementById("phone").value;

    // POST to backend to create/register taluk
    fetch('/api/taluk/register', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
            name: talukName,
            username: username,
            password: password,
            district: district,
            population: population,
            elevation: 0
        })
    })
    .then(r => r.json())
    .then(data => {
        if (data.error) {
            alert('Registration failed: ' + data.error);
            return;
        }
        // save basic info to localStorage for quick access
        localStorage.setItem('loggedInTaluk', data.taluk.name);
        // show success and redirect
        document.getElementById("successPopup").style.display = "flex";
    })
    .catch(err => {
        alert('Registration failed: ' + err);
    });

});

/* Redirect to Home */
function goToHome() {

    window.location.href = "../homepage/index.html";

}

</script>

</body>
</html>
