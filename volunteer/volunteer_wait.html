<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Volunteer Status</title>
    <link rel="stylesheet" href="volunteer.css">
    <style>
        .wait-container {
            max-width: 720px;
            margin: 80px auto;
            padding: 40px;
            text-align: center;
            background: rgba(255,255,255,0.9);
            border-radius: 16px;
        }
        .wait-title {
            font-size: 28px;
            margin-bottom: 10px;
        }
        .wait-subtitle {
            color: #555;
            margin-bottom: 20px;
        }
        .wait-status {
            display: inline-block;
            padding: 10px 16px;
            border-radius: 999px;
            background: #f2f2f2;
            font-weight: 600;
        }
    </style>
</head>
<body class="volunteer-page">
    <div class="wait-container">
        <div class="wait-title">You are on standby</div>
        <div class="wait-subtitle">We will notify you when help is needed.</div>
        <div class="wait-status">Waiting for call...</div>
        <div style="margin-top: 24px;">
            <a href="../homepage/index.html">Back to Home</a>
        </div>
    </div>
</body>
</html>
