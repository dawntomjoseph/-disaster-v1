<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<title>Volunteer Profile</title>

<link rel="stylesheet" href="volunteer_profile.css">

</head>

<body>

<!-- TOP BAR -->
<header class="top-bar">

<div class="logo">
Volunteer Profile
</div>

<button class="back-btn" onclick="goBack()">
← Back to Dashboard
</button>

</header>


<!-- PROFILE CONTAINER -->
<div class="profile-container">

<div class="profile-card">

<h2 class="section-title">
Volunteer Information
</h2>


<!-- NAME -->
<div class="field">
<label>Full Name</label>
<input id="volName" readonly>
</div>


<!-- USERNAME -->
<div class="field">
<label>Username</label>
<input id="volEmail" readonly>
</div>


<!-- TALUK -->
<div class="field">
<label>Belonging Taluk</label>

<input id="volTaluk" readonly>

</div>



<h2 class="section-title">
Contact Information
</h2>


<!-- PHONE -->
<div class="field">
<label>Phone Number</label>
<input id="volPhone">
</div>


<!-- AVAILABILITY -->
<div class="field">
<label>Availability</label>

<select id="volDays">

<option value="">Select availability</option>

<option>All Days</option>
<option>Weekdays Only</option>
<option>Weekends Only</option>
<option>Emergency Only</option>

</select>

</div>



<button class="save-btn" onclick="updateProfile()">
Update Profile
</button>


</div>
</div>



<script>

let currentVolunteerId = null;


/* LOAD PROFILE FROM DATABASE */
async function loadProfile(){

    const volunteerId =
        localStorage.getItem("volunteerId");

    if(!volunteerId){

        alert("Please login first");

        window.location.href =
            "volunteer.html";

        return;

    }

    currentVolunteerId =
        volunteerId;

    try{

        const response =
            await fetch(
                "/api/volunteer/" + volunteerId
            );

        const data =
            await response.json();

        if(!response.ok){

            alert(data.error);
            return;

        }

        const volunteer =
            data.volunteer;


        /* DISPLAY DATA */

        document.getElementById("volName").value =
            volunteer.name || "";

        document.getElementById("volEmail").value =
            volunteer.username || "";

        document.getElementById("volPhone").value =
            volunteer.phone || "";

        document.getElementById("volDays").value =
            volunteer.availability || "";


        /* TALUK DISPLAY (READ-ONLY) */

        if(volunteer.taluk_name){

            document.getElementById("volTaluk").value =
                volunteer.taluk_name;

        }
        else{

            document.getElementById("volTaluk").value =
                "Not assigned yet";

        }

    }
    catch(error){

        console.error(error);

        alert("Failed to load profile");

    }

}



/* UPDATE PROFILE (BACKEND + LOCALSTORAGE) */
async function updateProfile(){

    const phone =
        document.getElementById("volPhone").value;

    const availability =
        document.getElementById("volDays").value;


    try {
        const response = await fetch(
            "/api/volunteer/" + currentVolunteerId,
            {
                method: "PUT",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    phone: phone,
                    availability: availability
                })
            }
        );

        const data = await response.json();

        if (!response.ok) {
            alert("Error: " + (data.error || "Unknown error"));
            return;
        }

        /* Update localStorage copy */
        const volunteer =
            JSON.parse(
                localStorage.getItem("volunteer") || "{}"
            );

        volunteer.phone = phone;
        volunteer.availability = availability;

        localStorage.setItem(
            "volunteer",
            JSON.stringify(volunteer)
        );

        alert("Profile updated successfully");
    } catch (error) {
        console.error(error);
        alert("Failed to update profile: " + error.message);
    }

}



/* BACK BUTTON */
function goBack(){

window.location.href =
"volunteer_dashboard.html";

}


/* LOAD ON PAGE START */
loadProfile();

</script>


</body>
</html>
